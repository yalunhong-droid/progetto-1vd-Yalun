<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor of Kings</title>

<style>

{
margin: 0;
padding: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

.hero-section {
position: relative;
width: 100%;
height: 100vh;
overflow: hidden;
background-color: #000;
border-bottom: 2px solid rgba(255,255,255,0.2);
}

.bg-video {
position: absolute;
top: 50%;
left: 50%;
width: 100%;
height: 100%;
transform: translate(-50%, -50%);
object-fit: cover;
}

.nav-top {
position: absolute;
top: 0;
left: 0;
width: 100%;
padding: 15px 5%;
z-index: 10;
display: flex;
align-items: center;
background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}

.center-logo {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 99;
}

.form-section{
width:100%;
min-height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
}

.form-wrapper{
display:flex;
gap:60px;
align-items:center;
}

.side-column{
display:flex;
flex-direction:column;
gap:20px;
}

.side-box{
width:90px;
height:90px;
border-radius:10px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.2);
transition:0.3s;
}

.side-box:hover{
transform:scale(1.1);
}

.side-box img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.form-container{
width:400px;
padding:30px;
background:rgba(0,0,0,0.8);
border:1px solid rgba(255,255,255,0.2);
border-radius:10px;
color:#fff;
}

.form-group{
margin:15px 0;
}

.form-group input{
width:100%;
padding:10px;
margin-top:5px;
background: rgba(255,255,255,0.05);
color:#fff;
border:1px solid rgba(255,255,255,0.2);
}

.content-section{
min-height:100vh;
background:#111;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
text-align:center;
}

</style>
</head>

<body>

<div class="hero-section">

<video class="bg-video" autoplay muted loop playsinline
src="Closed Beta Announcement Video _ Honor of Kings.mp4"></video>
