<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor of Kings</title>

<style>
{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial;
}

.hero {
position: relative;
width: 100%;
height: 100vh;
}

.bg-video {
position: fixed;
top: 50%;
left: 50%;
min-width: 100%;
min-height: 100%;
transform: translate(-50%, -50%);
object-fit: cover;
z-index: -1;
}

.logo {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
}

.logo img {
width: 400px;
}

.nav {
position: absolute;
top: 0;
width: 100%;
padding: 15px;
background: rgba(0,0,0,0.3);
}

.nav img {
width: 120px;
}

.form-section {
background: #000;
display: flex;
justify-content: center;
padding: 50px 20px;
}

.form-container {
background: rgba(0,0,0,0.7);
padding: 30px;
border-radius: 10px;
color: white;
width: 300px;
}

.form-container h3 {
text-align: center;
margin-bottom: 20px;
}

.form-container input {
width: 100%;
margin: 10px 0;
padding: 10px;
}

.form-container button {
width: 100%;
padding: 12px;
background: blue;
color: white;
border: none;
cursor: pointer;
}
</style>

</head>

<body>

<video autoplay muted loop class="bg-video">
<source src="video.mp4" type="hq720.avif">
</video>

<div class="hero">

<div class="nav">
<img src="Honor_of_Kings_logo.png">
</div>

<div class="logo">
<img src="Honor_of_Kings_logo.png">
</div>

</div>

<div class="form-section">
<div class="form-container">

<h3>Inserisci le informazioni dell'utente</h3>

<input type="text" placeholder="Nome">

<input type="date">

<div>
<input type="radio" name="g"> Maschio
<input type="radio" name="g"> Femmina
</div>

<button>Invia</button>

</div>
</div>

</body>
</html>
