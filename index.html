<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor of Kings</title>
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Arial', sans-serif;
}

.page-container {
position: relative;
width: 100vw;
height: 100vh;
overflow: hidden;
background-color: #000;
}

.bg-video {
position: absolute;
top: 50%;
left: 50%;
min-width: 100%;
min-height: 100%;
width: auto;
height: auto;
transform: translate(-50%, -50%);
z-index: 1;
object-fit: cover;
}

.nav-top {
position: absolute;
top: 0;
left: 0;
width: 100%;
padding: 1rem 4%;
z-index: 10;
display: flex;
align-items: center;
background-color: rgba(0,0,0,0.3);
}

.hok-logo {
height: 35px;
width: auto;
display: block;
}
</style>
</head>
<body>
<div class="page-container">
<video class="bg-video" loop muted autoplay playsinline preload="auto" src="https://assets.mixkit.co/videos/preview/mixkit-cloudy-mountain-landscape-at-sunset-1221-large.mp4"></video>

<div class="nav-top">
<img src="Honor_of_Kings_logo.png" style="width:150px;" alt="Honor oof Kings">
</div>
</div>
  <div style="margin:20px; padding:20px; border:1px solid #ccc; border-radius:8px; max-width:400px;">
<h3 style="text-align:center;">Inserisci le informazioni dell'utente</h3>
<div style="margin:15px 0;">
<label>nome：</label>
<input type="text" placeholder="scrivi il tuo nome del gioco"
style="width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:4px;">
</div>

<div style="margin:15px 0;">
<label>data di nascita：</label>
<input type="date"
style="width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:4px;">
</div>

<div style="margin:15px 0;">
<label>maschio/femmina：</label><br>
<input type="radio" name="gender" id="male" checked>
<label for="male">maschio</label>
<input type="radio" name="gender" id="female">
<label for="female">femmina</label>
</div>
<button style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer;">Invia informazioni
</button>
</div>
  .mid-img{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:99;
}
  <img src="Honor_of_Kings_logo.png" style="width:150px;" alt="Honor oof Kings">      
</body>
</html>
