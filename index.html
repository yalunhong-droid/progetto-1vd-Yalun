<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor of Kings</title>

<style>
{
margin:0;
padding:0;
box-sizing:border-box;
}

body {
overflow: hidden;
}

.hero {
position: relative;
width: 100vw;
height: 100vh;
}
.hero video {
position: absolute;
top: 50%;
left: 50%;
min-width: 100%;
min-height: 100%;
transform: translate(-50%, -50%);
object-fit: cover;
}

.logo {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
}

.logo img {
width: 400px;
}

.nav {
position: absolute;
top: 0;
width: 100%;
padding: 15px;
background: rgba(0,0,0,0.4);
}

.nav img {
width: 120px;
}
</style>
</head>

<body>

<div class="hero">

<video autoplay muted loop>
<source src="https://assets.mixkit.co/videos/preview/mixkit-cloudy-mountain-landscape-at-sunset-1221-large.mp4">
</video>

<div class="nav">
<img src="Honor_of_Kings_logo.png">
</div>

<div class="logo">
<img src="Honor_of_Kings_logo.png">
</div>

</div>

</body>
</html>
