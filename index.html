<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor of Kings</title>
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Arial', sans-serif;
}

.page-container {
position: relative;
width: 100vw;
height: 100vh;
overflow: hidden;
background-color: #000;
}

.bg-video {
position: absolute;
top: 50%;
left: 50%;
min-width: 100%;
min-height: 100%;
width: auto;
height: auto;
transform: translate(-50%, -50%);
z-index: 1;
object-fit: cover;
}

.nav-top {
position: absolute;
top: 0;
left: 0;
width: 100%;
padding: 1rem 4%;
z-index: 10;
display: flex;
align-items: center;
background-color: rgba(0,0,0,0.3);
}

/* 【核心修复】表单样式：固定在右下角，不挡logo */
.form-container {
position: absolute;
bottom: 30px;
right: 30px;
z-index: 100;
margin: 0;
padding: 20px;
border:1px solid #ccc;
border-radius:8px;
max-width:400px;
width: 90%;
background-color: rgba(0,0,0,0.7);
color: #fff;
}

.form-container h3 {
text-align:center;
margin-bottom: 20px;
}

.form-group {
margin:15px 0;
}

.form-group input {
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ddd;
border-radius:4px;
}

.form-group button {
width:100%;
padding:12px;
background:#007bff;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
font-size: 16px;
}
</style>
</head>
<body>
<div class="page-container">
<video class="bg-video" loop muted autoplay playsinline preload="auto" src="https://assets.mixkit.co/videos/preview/mixkit-cloudy-mountain-landscape-at-sunset-1221-large.mp4"></video>
<header>
<div class="nav-top">
<img src="Honor_of_Kings_logo.png" style="width:150px;" alt="Honor of Kings">
</div>
</header>
<div style="position: absolute;top: 50%;left: 50%;transform: translate(-50%, -50%);z-index: 99;">
<img src="Honor_of_Kings_logo.png" style="width: 500px;" alt="Honor of Kings">
</div>
<div class="form-container">
<h3>Inserisci le informazioni dell'utente</h3>
<div class="form-group">
<label>nome：</label>
<input type="text" placeholder="scrivi il tuo nome del gioco">
</div>
<div class="form-group">
<label>data di nascita：</label>
<input type="date">
</div>
<div class="form-group">
<label>maschio/femmina：</label><br>
<input type="radio" name="gender" id="male" checked>
<label for="male">maschio</label>
<input type="radio" name="gender" id="female">
<label for="female">femmina</label>
</div>
<div class="form-group">
<button>Invia informazioni</button>
</div>
</div>

</div>
</body>
</html>
