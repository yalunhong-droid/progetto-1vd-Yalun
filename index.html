<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honor of Kings</title>

<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Arial', sans-serif;
}

.hero-section {
position: relative;
width: 100vw;
height: 60vh;
overflow: hidden;
background-color: #000;
border-bottom: 2px solid rgba(255,255,255,0.2);
}

.hero-section::after {
content: "";
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 120px;
background: linear-gradient(to bottom, transparent, #000);
z-index: 5;
}

.bg-video {
position: absolute;
top: 50%;
left: 50%;
min-width: 100%;
min-height: 100%;
width: auto;
height: auto;
transform: translate(-50%, -50%);
z-index: 1;
object-fit: cover;
}

.nav-top {
position: absolute;
top: 0;
left: 0;
width: 100%;
padding: 1rem 4%;
z-index: 10;
display: flex;
align-items: center;
background-color: rgba(0,0,0,0.3);
}

.center-logo {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 99;
}

.form-section {
width: 100%;
min-height: 100vh;
background-color: #000;
display: flex;
align-items: center;
justify-content: center;
padding: 40px 20px;
}

.form-container {
width: 100%;
max-width: 400px;
padding: 30px;
border:1px solid #ccc;
border-radius:8px;
background-color: rgba(0,0,0,0.7);
color: #fff;
}

.form-container h3 {
text-align:center;
margin-bottom: 25px;
font-size: 22px;
}

.form-group {
margin:20px 0;
}

.form-group label {
font-size: 16px;
}

.form-group input {
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:4px;
font-size: 14px;
}

.form-group button {
width:100%;
padding:14px;
background:#007bff;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
font-size: 16px;
margin-top: 10px;
}

.radio-group {
margin-top: 8px;
}
.radio-group label {
margin-right: 20px;
cursor: pointer;
}

.content-section {
width: 100%;
min-height: 100vh;
background: #111;
color: #fff;
padding: 60px 20px;
display: flex;
align-items: center;
justify-content: center;
}

.content-container {
max-width: 1200px;
margin: 0 auto;
text-align: center;
}

.content-container h2 {
font-size: 32px;
margin-bottom: 30px;
}

.content-container p {
font-size: 18px;
line-height: 1.8;
}
</style>
</head>

<body>

<div class="hero-section">
<video class="bg-video" loop muted autoplay playsinline preload="auto"
src="Closed Beta Announcement Video _ Honor of Kings.mp4"></video>

<div class="nav-top">
<img src="Honor_of_Kings_logo.png" style="width:150px;" alt="Honor of Kings">
</div>

<div class="center-logo">
<img src="Honor_of_Kings_logo.png" style="width: 500px;" alt="Honor of Kings">
</div>
</div>

<div class="form-section">
<div class="form-container">
<h3>Inserisci le informazioni dell'utente</h3>

<div class="form-group">
<label>nome:</label>
<input type="text" placeholder="scrivi il tuo nome del gioco">
</div>

<div class="form-group">
<label>data di nascita:</label>
<input type="date">
</div>

<div class="form-group">
<label>maschio/femmina:</label>
<div class="radio-group">
<input type="radio" name="gender" id="male" checked>
<label for="male">maschio</label>

<input type="radio" name="gender" id="female">
<label for="female">femmina</label>
</div>
</div>

<div class="form-group">
<button>Invia informazioni</button>
</div>

</div>
</div>

<div class="content-section">
<div class="content-container">
<h2>Benvenuto in Honor of Kings</h2>
</div>
</div>

</body>
</html>
